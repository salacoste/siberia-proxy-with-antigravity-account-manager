name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Add Go Bin to PATH
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ./apps/backend
        run: |
          wails build -tags webkit2_41 -o siberia-linux-amd64
          mv build/bin/siberia-linux-amd64 ../../siberia-linux-amd64

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: ./apps/backend
        run: |
          wails build -o siberia-windows-amd64.exe
          mv build/bin/siberia-windows-amd64.exe ../../siberia-windows-amd64.exe

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: ./apps/backend
        run: |
          wails build
          cd build/bin
          ditto -c -k --sequesterRsrc siberia.app ../../../siberia-macos-universal.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.os }}
          path: |
            siberia-linux-amd64
            siberia-windows-amd64.exe
            siberia-macos-universal.zip
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-artifacts-*
          merge-multiple: true

      - name: Display Downloaded Files
        run: ls -R

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            siberia-linux-amd64
            siberia-windows-amd64.exe
            siberia-macos-universal.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
