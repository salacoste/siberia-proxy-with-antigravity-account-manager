name: Wails Build

on:
  push:
    branches: [ "main", "develop" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Wails
      run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

    - name: Add Go Bin to PATH
      shell: bash
      run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Install Linux Deps
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
        
        # Robust Workaround: Check if pkg-config finds it first
        if pkg-config --exists appindicator3-0.1; then
          echo "Success: appindicator3-0.1 found natively."
          exit 0
        fi

        echo "Package not found natively. Attempting to locate ayatana-appindicator3-0.1.pc..."
        
        # Limit search to likely directories to avoid timeout/permission errors on /usr
        AYATANA_PC=$(find /usr/lib /usr/share -name "ayatana-appindicator3-0.1.pc" 2>/dev/null | head -n 1)
        
        if [ -z "$AYATANA_PC" ]; then
          echo "Error: ayatana-appindicator3-0.1.pc not found in target locations."
          # Debug: List what IS there
          echo "Debug: Listing *indicator*.pc files:"
          find /usr/lib /usr/share -name "*indicator*.pc" 2>/dev/null || true
          exit 1
        fi
        
        echo "Found Ayatana PC at: $AYATANA_PC"
        PC_DIR=$(dirname "$AYATANA_PC")
        
        # Symlink if target doesn't exist
        if [ ! -f "$PC_DIR/appindicator3-0.1.pc" ]; then
           sudo ln -sf "$AYATANA_PC" "$PC_DIR/appindicator3-0.1.pc"
           echo "Created symlink at $PC_DIR/appindicator3-0.1.pc"
        else
           echo "Symlink or file already exists at $PC_DIR/appindicator3-0.1.pc"
        fi
        
        # Verify pkg-config sees it
        export PKG_CONFIG_PATH="$PC_DIR:$PKG_CONFIG_PATH"
        pkg-config --print-errors --exists appindicator3-0.1 && echo "Success: pkg-config found appindicator3-0.1 via patching"

    - name: Build
      working-directory: ./apps/backend
      env:
        CGO_ENABLED: 1
      run: wails build -tags webkit2_41 -o siberia-${{ runner.os }}

    # Rename output for Windows to include .exe if wails doesn't automatically do it cleanly with -o
    - name: Rename Windows Output
      if: runner.os == 'Windows'
      working-directory: ./apps/backend/build/bin
      run: |
        if (Test-Path siberia-Windows-latest) { Move-Item siberia-Windows-latest siberia-windows-amd64.exe }
        elseif (Test-Path siberia-Windows-latest.exe) { Move-Item siberia-Windows-latest.exe siberia-windows-amd64.exe }

    # Rename others for clarity
    - name: Rename Assets (Unix)
      if: runner.os != 'Windows'
      working-directory: ./apps/backend/build/bin
      run: |
        # Convert runner.os to lowercase (Linux -> linux, macOS -> darwin)
        OS_NAME=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]' | sed 's/macos/darwin/')
        
        # Identify source file (Wails default output)
        SRC="siberia-${{ runner.os }}"
        
        # Define target name (assuming amd64 for now as wails cross-compile isn't setup in matrix)
        # Verify if file exists before moving
        if [ -f "$SRC" ]; then
          mv "$SRC" "siberia-${OS_NAME}-amd64"
        fi

    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          apps/backend/build/bin/siberia-*-amd64
          apps/backend/build/bin/siberia-*-amd64.exe
        generate_release_notes: true
        draft: true
        prerelease: false


