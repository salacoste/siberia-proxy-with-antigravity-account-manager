name: Wails Build

on:
  push:
    branches: [ "main", "develop" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Wails
      run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

    - name: Add Go Bin to PATH
      shell: bash
      run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Install Linux Deps
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

    - name: Build
      working-directory: ./apps/backend
      run: wails build -tags webkit2_41 -o siberia-${{ runner.os }}

    # Rename output for Windows to include .exe if wails doesn't automatically do it cleanly with -o
    - name: Rename Windows Output
      if: runner.os == 'Windows'
      working-directory: ./apps/backend/build/bin
      run: |
        if (Test-Path siberia-Windows-latest) { Move-Item siberia-Windows-latest siberia-windows-amd64.exe }
        elseif (Test-Path siberia-Windows-latest.exe) { Move-Item siberia-Windows-latest.exe siberia-windows-amd64.exe }

    # Rename others for clarity
    - name: Rename Assets
      if: runner.os != 'Windows'
      working-directory: ./apps/backend/build/bin
      run: |
        mv siberia-${{ runner.os }} siberia-${{ runner.os }}-amd64 || true
        # macOS might be universal or arm64/amd64 depending on runner. Actions macOS-latest is arm64 (M1) usually now?
        # Actually macos-latest is currently x86_64 (Intel) -> macos-13, but macos-14 is arm64.
        # Wails builds universal by default on mac? No, depends on arch.
        # For MVP, we just upload what we built.

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          apps/backend/build/bin/*

